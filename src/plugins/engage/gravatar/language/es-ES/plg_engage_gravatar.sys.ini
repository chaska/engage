PLG_ENGAGE_GRAVATAR="Akeeba Engage – Integración con Gravatar"
PLG_ENGAGE_GRAVATAR_XML_DESC="Plugin que muestra el avatar de los comentarios con el servicio gratuito de terceros <a href='https://gravatar.com/'>Gravatar</a>. Por defecto pide permiso al visitante antes de contactar con Gravatar."

PLG_ENGAGE_GRAVATAR_FIELDSET_BASIC_LABEL="Básico"
PLG_ENGAGE_GRAVATAR_FIELDSET_BASIC_DESC="Opciones básicas de la integración con Gravatar."

PLG_ENGAGE_GRAVATAR_PROFILE_LINK_LABEL="Mostrar enlace al perfil"
PLG_ENGAGE_GRAVATAR_PROFILE_LINK_DESC="¿Debe enlazarse el avatar con la página pública del perfil de Gravatar? Solo se aplica en el modo Siempre: en Preguntar y Desactivado nunca se emite el enlace (envía el hash del email a Gravatar)."

PLG_ENGAGE_GRAVATAR_RATING_LABEL="Clasificación"
PLG_ENGAGE_GRAVATAR_RATING_DESC="La clasificación de contenido permitida para los avatares. G es apta para todos los públicos. X no es apta para el trabajo."
PLG_ENGAGE_GRAVATAR_RATING_G="G (Apta para todos los públicos)"
PLG_ENGAGE_GRAVATAR_RATING_PG="PG (Gestos groseros, desnudez parcial, palabrotas, violencia leve)"
PLG_ENGAGE_GRAVATAR_RATING_R="R (Lenguaje muy soez, violencia intensa, desnudez, consumo de drogas duras)"
PLG_ENGAGE_GRAVATAR_RATING_X="X (Imágenes sexuales explícitas, violencia extremadamente perturbadora)"

PLG_ENGAGE_GRAVATAR_DEFAULT_IMAGE_LABEL="Imagen por defecto"
PLG_ENGAGE_GRAVATAR_DEFAULT_IMAGE_DESC="El avatar que se muestra si el usuario no tiene uno creado en Gravatar. Si se elige personalizada, seleccione una imagen en el campo de abajo. En los modos Preguntar y Desactivado, el avatar local previo al consentimiento es una silueta genérica (o la imagen personalizada de su propio sitio, o vacío con Imagen en blanco); estas opciones solo afectan a lo que devuelve Gravatar."
PLG_ENGAGE_GRAVATAR_DEFAULT_IMAGE_MP="Persona misteriosa"
PLG_ENGAGE_GRAVATAR_DEFAULT_IMAGE_IDENTICON="Identicon"
PLG_ENGAGE_GRAVATAR_DEFAULT_IMAGE_MONSTERID="MonsterID"
PLG_ENGAGE_GRAVATAR_DEFAULT_IMAGE_WAVATAR="Wavatar"
PLG_ENGAGE_GRAVATAR_DEFAULT_IMAGE_RETRO="Retro"
PLG_ENGAGE_GRAVATAR_DEFAULT_IMAGE_ROBOHASH="RoboHash"
PLG_ENGAGE_GRAVATAR_DEFAULT_IMAGE_BLANK="Imagen en blanco"
PLG_ENGAGE_GRAVATAR_DEFAULT_IMAGE_CUSTOM="Imagen personalizada"

PLG_ENGAGE_GRAVATAR_CUSTOM_DEFAULT_LABEL="Imagen personalizada por defecto"
PLG_ENGAGE_GRAVATAR_CUSTOM_DEFAULT_DESC="Elija la imagen que se usará como avatar por defecto si la opción anterior es Imagen personalizada."

PLG_ENGAGE_GRAVATAR_FORCE_DEFAULT_LABEL="Forzar imagen por defecto"
PLG_ENGAGE_GRAVATAR_FORCE_DEFAULT_DESC="¿Mostrar siempre la imagen por defecto aunque el usuario tenga un Gravatar? Tiene sentido con una imagen por defecto generada algorítmicamente a partir del email de quien comenta (no Persona misteriosa, en blanco ni personalizada)."

PLG_ENGAGE_GRAVATAR_MODE_LABEL="Modo de Gravatar"
PLG_ENGAGE_GRAVATAR_MODE_DESC="Este ajuste controla cuándo el navegador del visitante puede contactar con gravatar.com (esto envía la IP del visitante a un tercero). Preguntar: se muestra un avatar genérico local y las fotos de Gravatar solo se cargan cuando el visitante acepta. Desactivado: nunca se contacta con Gravatar. Siempre: las fotos se cargan sin preguntar; úselo solo si su política de privacidad ya lo cubre. Las instalaciones guardadas antes de existir esta opción se comportan como Preguntar."
PLG_ENGAGE_GRAVATAR_MODE_ASK="Preguntar antes al visitante (recomendado)"
PLG_ENGAGE_GRAVATAR_MODE_OFF="Desactivado (nunca contactar con Gravatar)"
PLG_ENGAGE_GRAVATAR_MODE_ALWAYS="Siempre (sin pedir consentimiento)"
PLG_ENGAGE_GRAVATAR_SHOW_NOTICE_LABEL="Mostrar el aviso de consentimiento"
PLG_ENGAGE_GRAVATAR_SHOW_NOTICE_DESC="Se muestra encima de los comentarios el aviso propio del plugin con el botón de aceptar. Póngalo en No si su sitio ya tiene un gestor de cookies/consentimiento conectado mediante la API de JavaScript (vea docs/GRAVATAR-CONSENTIMIENTO.md); la API sigue funcionando."

PLG_ENGAGE_GRAVATAR_CONSENT_SOURCE_LABEL="Quién decide (origen del consentimiento)"
PLG_ENGAGE_GRAVATAR_CONSENT_SOURCE_DESC="Solo se aplica en el modo Preguntar. Aviso propio de Engage: el plugin muestra su propio botón encima de los comentarios (por defecto, sin cambios). Módulo JBCookies: el plugin no muestra aviso y la elección del visitante se lee del gestor de cookies JBCookies. Si el módulo no está instalado o el visitante aún no ha decidido, NO se carga ninguna foto de Gravatar. Ojo: JBCookies solo guarda la elección; por sí solo no bloquea otros scripts de terceros."
PLG_ENGAGE_GRAVATAR_CONSENT_SOURCE_ENGAGE="Aviso propio de Engage (por defecto)"
PLG_ENGAGE_GRAVATAR_CONSENT_SOURCE_JBCOOKIES="Módulo JBCookies (gestor de cookies)"
PLG_ENGAGE_GRAVATAR_JBCOOKIES_GROUP_LABEL="Grupo de JBCookies (opcional)"
PLG_ENGAGE_GRAVATAR_JBCOOKIES_GROUP_DESC="Déjelo VACÍO (recomendado para empezar): las fotos solo se cargan cuando el visitante hace clic en Aceptar todas en JBCookies. Si además quiere respetar «Guardar selección», escriba el identificador del grupo que el visitante debe activar, por ejemplo marketing (JBCookies 6.0 ofrece los grupos fijos analytics, marketing y unassigned; «necessary» no se acepta porque siempre está activo). Solo minúsculas, números, guion y guion bajo. Si el grupo no está activado, no se carga ninguna foto."
