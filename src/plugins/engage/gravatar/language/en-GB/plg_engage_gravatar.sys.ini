PLG_ENGAGE_GRAVATAR="Akeeba Engage – Gravatar integration"
PLG_ENGAGE_GRAVATAR_XML_DESC="Displays avatar for comments using the free, third party <a href='https://gravatar.com/'>Gravatar</a> service."

PLG_ENGAGE_GRAVATAR_FIELDSET_BASIC_LABEL="Basic"
PLG_ENGAGE_GRAVATAR_FIELDSET_BASIC_DESC="Basic configuration options for the Gravatar integration."

PLG_ENGAGE_GRAVATAR_PROFILE_LINK_LABEL="Show profile link"
PLG_ENGAGE_GRAVATAR_PROFILE_LINK_DESC="Should the user's avatar be linked to their public Gravatar profile page? Only applies in Always mode: in Ask and Off the link is never output (it sends the e-mail hash to Gravatar)."

PLG_ENGAGE_GRAVATAR_RATING_LABEL="Rating"
PLG_ENGAGE_GRAVATAR_RATING_DESC="The content rating allowed for avatars. G is the kid-safe level. X is very much not safe for work."
PLG_ENGAGE_GRAVATAR_RATING_G="G (Suitable for all audiences)"
PLG_ENGAGE_GRAVATAR_RATING_PG="PG (Rude gestures, partial nudity, swearing, mild violence)"
PLG_ENGAGE_GRAVATAR_RATING_R="R (Harsh profanity, intense violence, nudity, hard drug use)"
PLG_ENGAGE_GRAVATAR_RATING_X="X (Hardcore sexual imagery, extremely disturbing violence)"

PLG_ENGAGE_GRAVATAR_DEFAULT_IMAGE_LABEL="Default image"
PLG_ENGAGE_GRAVATAR_DEFAULT_IMAGE_DESC="The default avatar to display if one has not already been created in the Gravatar service. If you choose custom you need to select an image in the Custom Default Image field below. In the Ask and Off modes the local avatar shown before consent is a generic silhouette (or your own custom image, or empty for Blank Image); these options only affect what Gravatar returns."
PLG_ENGAGE_GRAVATAR_DEFAULT_IMAGE_MP="Mystery Person"
PLG_ENGAGE_GRAVATAR_DEFAULT_IMAGE_IDENTICON="Identicon"
PLG_ENGAGE_GRAVATAR_DEFAULT_IMAGE_MONSTERID="MonsterID"
PLG_ENGAGE_GRAVATAR_DEFAULT_IMAGE_WAVATAR="Wavatar"
PLG_ENGAGE_GRAVATAR_DEFAULT_IMAGE_RETRO="Retro"
PLG_ENGAGE_GRAVATAR_DEFAULT_IMAGE_ROBOHASH="RoboHash"
PLG_ENGAGE_GRAVATAR_DEFAULT_IMAGE_BLANK="Blank Image"
PLG_ENGAGE_GRAVATAR_DEFAULT_IMAGE_CUSTOM="Custom Image"

PLG_ENGAGE_GRAVATAR_CUSTOM_DEFAULT_LABEL="Custom Default Image"
PLG_ENGAGE_GRAVATAR_CUSTOM_DEFAULT_DESC="Choose an image to use as the default avatar if the above option is set to Custom Image."

PLG_ENGAGE_GRAVATAR_FORCE_DEFAULT_LABEL="Force default image"
PLG_ENGAGE_GRAVATAR_FORCE_DEFAULT_DESC="Should I always display the default image even if there is a Gravatar for the commenting user? This makes sense with the Default Image option set to anything other than Mystery Person, Blank Image or Custom Image, i.e. it algorithmically generates an image based on the commenting user's email address."

PLG_ENGAGE_GRAVATAR_MODE_LABEL="Gravatar mode"
PLG_ENGAGE_GRAVATAR_MODE_DESC="Controls when the visitor's browser may contact gravatar.com (this sends the visitor's IP address to a third party). Ask: a generic local avatar is shown and the Gravatar photos are loaded only after the visitor accepts. Off: Gravatar is never contacted. Always: photos are loaded without asking; use it only if your privacy policy already covers it. Installations saved before this option existed behave as Ask."
PLG_ENGAGE_GRAVATAR_MODE_ASK="Ask the visitor first (recommended)"
PLG_ENGAGE_GRAVATAR_MODE_OFF="Off (never contact Gravatar)"
PLG_ENGAGE_GRAVATAR_MODE_ALWAYS="Always (no consent request)"
PLG_ENGAGE_GRAVATAR_SHOW_NOTICE_LABEL="Show the consent notice"
PLG_ENGAGE_GRAVATAR_SHOW_NOTICE_DESC="Shows the plugin's own notice with the accept button above the comments. Set it to No if your site already has a cookie/consent manager connected through the JavaScript API (see docs/GRAVATAR-CONSENTIMIENTO.md); the API keeps working."

PLG_ENGAGE_GRAVATAR_CONSENT_SOURCE_LABEL="Who decides (consent source)"
PLG_ENGAGE_GRAVATAR_CONSENT_SOURCE_DESC="Only applies in Ask mode. Engage's own notice: the plugin shows its own button above the comments (default, unchanged). JBCookies module: the plugin shows no notice and the visitor's choice is read from the JBCookies cookie manager. If the module is not installed or the visitor has not decided yet, NO photo is ever loaded from Gravatar. Note: JBCookies only stores the choice; it does not block other third-party scripts by itself."
PLG_ENGAGE_GRAVATAR_CONSENT_SOURCE_ENGAGE="Engage's own notice (default)"
PLG_ENGAGE_GRAVATAR_CONSENT_SOURCE_JBCOOKIES="JBCookies module (cookie manager)"
PLG_ENGAGE_GRAVATAR_JBCOOKIES_GROUP_LABEL="JBCookies group (optional)"
PLG_ENGAGE_GRAVATAR_JBCOOKIES_GROUP_DESC="Leave it EMPTY (recommended to start): photos load only when the visitor presses Accept all in JBCookies. To also respect 'Save selection', type the slug of the group the visitor must switch on, e.g. marketing (JBCookies 6.0 offers the fixed groups analytics, marketing and unassigned; 'necessary' is not accepted because it is always on). Only lower case letters, digits, hyphen and underscore. If the group is not switched on, no photo is loaded."
