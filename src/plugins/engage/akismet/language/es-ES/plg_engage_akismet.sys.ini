PLG_ENGAGE_AKISMET_DISCARD_BLATANT_LABEL="Descartar el SPAM evidente"
PLG_ENGAGE_AKISMET_DISCARD_BLATANT_DESC="<p>Si se activa, los comentarios identificados como SPAM <strong>evidente</strong> se eliminarán de inmediato en lugar de guardarse y marcarse como SPAM. Los comentarios que probablemente son SPAM se seguirán guardando y marcando como SPAM para que los administradores de comentarios puedan revisarlos.</p><p>Akismet recomienda encarecidamente activar esta opción. Según sus estimaciones, reduce en un 80 % aproximadamente el SPAM de comentarios que tiene que moderar.</p>"