PLG_USER_ENGAGE_OWN_COMMENTS_LABEL="Comentarios propios de invitado al iniciar sesión"
PLG_USER_ENGAGE_OWN_COMMENTS_DESC="<p>Cada vez que un usuario inicia sesión, Akeeba Engage buscará comentarios publicados como invitado con el mismo email que el usuario que ha iniciado sesión. Si encuentra alguno, se atribuirá al usuario real en lugar de ser comentarios de invitado.</p><p>El caso de uso práctico es el de alguien que lleva un tiempo publicando comentarios como invitado antes de registrarse con una cuenta de usuario de Joomla. Que sus comentarios aparezcan unos como de invitado y otros como de usuario puede confundir al usuario y a los administradores de comentarios. Activar esta opción soluciona esa confusión. Sin embargo, tenga en cuenta que acabará viendo comentarios publicados por un usuario <em>antes</em> de crear su cuenta de usuario en Joomla, lo que puede desorientar un poco a los administradores del sitio. Si quiere evitar ambos problemas, no permita comentarios de invitados – es el ajuste por defecto de Akeeba Engage.</p>"