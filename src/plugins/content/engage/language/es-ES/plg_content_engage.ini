PLG_CONTENT_ENGAGE_FORM_HEAD="Comentarios"
PLG_CONTENT_ENGAGE_FORM_SUBHEAD="Configure los comentarios en los artículos. Powered by Akeeba Engage."

PLG_CONTENT_ENGAGE_COMMENTS_SHOW_LABEL="Interfaz de comentarios"
PLG_CONTENT_ENGAGE_COMMENTS_SHOW_DESC="¿Mostrar la interfaz de comentarios? Si se elige Ocultar, se ocultarán todos los comentarios existentes y se deshabilitarán los nuevos."

PLG_CONTENT_ENGAGE_DEFAULT_PUBLISH_LABEL="Nuevos comentarios"
PLG_CONTENT_ENGAGE_DEFAULT_PUBLISH_DESC="<p>¿Deben publicarse o quedar sin publicar por defecto los comentarios nuevos? En el segundo caso, un administrador de comentarios tiene que publicarlos manualmente. La opción “Usar global” (por defecto) hace que Akeeba Engage haga lo que haya especificado en la página de Opciones del componente.</p><p><strong>¡IMPORTANTE!</strong> Esta opción NO se aplica a los comentarios publicados por administradores de comentarios. Esos comentarios se publican siempre de inmediato. No tendría sentido pedir a quien publica un comentario que lo modere él mismo.</p>"

PLG_CONTENT_ENGAGE_COMMENTS_SHOW_FEATURE_LABEL="Resumen en la vista de destacados"
PLG_CONTENT_ENGAGE_COMMENTS_SHOW_FEATURE_DESC="¿Mostrar el número de comentarios enviados a cada artículo en la vista de Artículos destacados de Joomla?"

PLG_CONTENT_ENGAGE_COMMENTS_SHOW_CATEGORY_LABEL="Resumen en la vista de blog"
PLG_CONTENT_ENGAGE_COMMENTS_SHOW_CATEGORY_DESC="¿Mostrar el número de comentarios enviados a cada artículo en la vista de blog de Joomla?"

PLG_CONTENT_ENGAGE_COMMENTS_SHOW_ARTICLE_LABEL="Resumen en el módulo Newsflash"
PLG_CONTENT_ENGAGE_COMMENTS_SHOW_ARTICLE_DESC="¿Mostrar el número de comentarios enviados a cada artículo mostrado en el módulo Newsflash de Joomla?"

PLG_CONTENT_ENGAGE_OPT_COMMENTS_SHOW_BEFORE="Antes del contenido"
PLG_CONTENT_ENGAGE_OPT_COMMENTS_SHOW_AFTER="Después del contenido"

PLG_CONTENT_ENGAGE_COMMENTS_ORDERING_LABEL="Orden de los comentarios"
PLG_CONTENT_ENGAGE_COMMENTS_ORDERING_DESC="Orden en que se muestran los comentarios, por fecha. Ascendente muestra primero los comentarios más antiguos. Descendente muestra primero los más recientes."

PLG_CONTENT_ENGAGE_COMMENTS_ENABLED_LABEL="Permitir nuevos comentarios"
PLG_CONTENT_ENGAGE_COMMENTS_ENABLED_DESC="¿Permitir nuevos comentarios? Si se elige No, se bloquearán los comentarios (se verán los existentes pero no se permitirá añadir un comentario nuevo)."

PLG_CONTENT_ENGAGE_COMMENTS_CLOSE_AFTER_LABEL="Cerrar comentarios cuando pasen estos días"
PLG_CONTENT_ENGAGE_COMMENTS_CLOSE_AFTER_DESC="Los comentarios se cerrarán cuando pasen este número de días desde que el artículo fue publicado. 0 es un valor especial y significa que los comentarios no se cerrarán automáticamente."

PLG_CONTENT_ENGAGE_COMMENTS_NOTIFY_AUTHOR_LABEL="Notificar al autor"
PLG_CONTENT_ENGAGE_COMMENTS_NOTIFY_AUTHOR_DESC="¿Notificar (enviar emails) al autor del contenido de los nuevos comentarios en su contenido?"

PLG_CONTENT_ENGAGE_COMMENTS_NOTIFY_USERS_LABEL="Notificar a los usuarios"
PLG_CONTENT_ENGAGE_COMMENTS_NOTIFY_USERS_DESC="¿Notificar (enviar emails) a los usuarios cuando haya una respuesta a los comentarios que enviaron en el contenido?"
