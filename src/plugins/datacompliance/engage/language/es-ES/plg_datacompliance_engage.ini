PLG_DATACOMPLIANCE_ENGAGE_DOMAINNAME="Comentarios (a través de Akeeba Engage)"

PLG_DATACOMPLIANCE_ENGAGE_DOMAINNAMEACTIONS_1="Los comentarios que haya enviado serán sanitizados. Su contenido se reemplazará por un mensaje indicando que el comentario ha sido borrado tras la eliminación de su cuenta de usuario. Cualquier comentario como invitado que haya enviado desde la misma dirección de email también se sanitizará del mismo modo; además, el nombre y la dirección de email también serán reemplazados."
