COM_ENGAGE_MAIL_NOTIFY_DESC="Se envía a las personas que han comentado en un artículo cuando reciben una respuesta a su comentario."
COM_ENGAGE_MAIL_NOTIFY_SUBJECT="Nueva respuesta a su comentario en “{CONTENT_TITLE}”"
COM_ENGAGE_MAIL_NOTIFY_BODY="Hola {RECIPIENT_NAME},\n\nSe ha publicado una respuesta a su comentario anterior en “{CONTENT_TITLE}”.\n\nA continuación tiene los detalles del comentario.\n\n{NAME}\n\nel {DATE_LOCAL}\n\n{COMMENT_SANITIZED}\n\nURL del comentario: {COMMENT_LINK}\n\nUsted recibe este email porque comentó en “{CONTENT_TITLE}”.\nSi no desea recibir estos emails puede darse de baja: {UNSUBSCRIBE_URL}\nEl enlace para darse de baja solo afecta a las notificaciones del contenido en el que se envió este comentario. No le da de baja de las notificaciones de los comentarios enviados a cualquier otro contenido de nuestro sitio en el que ya haya comentado. Si envía un nuevo comentario en ese contenido, volverá a suscribirse a las notificaciones.\n\nPor favor, no responda a este email: se envía desde una dirección de email que no se supervisa."
