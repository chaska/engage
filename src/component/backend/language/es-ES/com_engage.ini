COM_ENGAGE_TITLE_EMAILTEMPLATES="Plantillas de email"

COM_ENGAGE_MAIL_MANAGE_TITLE="Moderar: Pedir a los administradores de comentarios que moderen un comentario nuevo sin publicar"
COM_ENGAGE_MAIL_MANAGE_SHORT="Moderar"
COM_ENGAGE_MAIL_MANAGE_DESC="Se envía a los administradores de comentarios cuando un comentario sin publicar espera moderación."
COM_ENGAGE_MAIL_MANAGE_SUBJECT="Un nuevo comentario en “{CONTENT_TITLE}” espera su moderación"
COM_ENGAGE_MAIL_MANAGE_BODY="Hola {RECIPIENT_NAME},\n\nSe ha enviado un nuevo comentario en “{CONTENT_TITLE}”. El comentario está actualmente sin publicar y espera su moderación.\n\nA continuación tiene los detalles del comentario.\n\n{NAME} <{EMAIL}>\nDesde {IP}, el {DATE_LOCAL}\nAgente de usuario: {USER_AGENT}\n\n{COMMENT_SANITIZED}\n\nURL del comentario: {COMMENT_LINK}\n\nUsted recibe este email porque es administrador de comentarios del contenido que se ha comentado.\nNo puede darse de baja de estos emails porque es administrador de comentarios.\nPor favor, no responda a este email: se envía desde una dirección de email que no se supervisa."
COM_ENGAGE_MAIL_MANAGE_BODY_HTML="<style type=\"text/css\"> :root { color-scheme: light dark; } /*Reset styles*/ body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 12pt; margin: 0; padding: 0; color: black; background: slategrey; } .engageemail-outer-wrapper { background: slategrey; } .engageemail-outer-wrapper table { width: 100%; max-width: 960px; margin: 0 auto; } .engageemail-wrapper { width: 100%; height: 100%; padding: 1em; } .engageemail-container { background-color: white; color: black; text-align: left; box-shadow: black 0 0 8px; } .engageemail-sitename { background-color: #efefef; text-align: right; padding: 1em 1em; min-height: 40px; } .engageemail-sitename a { color: black; font-size: 16pt; border: none; text-decoration: none; } .engageemail-message { padding: 0.5em 1em; } .engageemail-message a { color: #38b5b8; text-decoration: underline; } .engageemail-comment-header { padding: 0.25em; background-color: darkslategray; color: white; } img.engageemail-comment-header-avatar { float: left; margin: 0 0.5em 0.5em 0; } span.engageemail-comment-name { display: block; font-weight: bold; } span.engageemail-comment-email { display: block; font-size: 90%; } span.engageemail-comment-ip, span.engageemail-comment-date, span.engageemail-comment-user-agent { font-size: 90%; color: lightgrey; } span.engageemail-comment-user-agent:before { content: \" • \"; } .engageemail-comment { margin: 0.5em 0; border-left: 3px solid grey; padding: 0 .5em; overflow: scroll; } a.engageemail-button { display: inline-block; text-align: center; padding: 0.25em 0.5em; color: cornflowerblue; box-sizing: border-box; text-decoration: none; font-size: 10pt; } a.engageemail-button:hover { color: dodgerblue; } a.engageemail-button-success { color: seagreen; } a.engageemail-button-success:hover { color: darkseagreen; } a.engageemail-button-warning { color: darkorange; } a.engageemail-button-warning:hover { color: orange; } a.engageemail-button-danger { color: red; } a.engageemail-button-danger:hover { color: darkred; } .engageemail-legalinfo { text-align: center; width: 100%; max-width: 960px; color: lightgrey; font-size: 9pt; font-weight: normal; background-color: rgba(0, 0, 0, 0.2); margin: 2em auto; padding: 0.5em 0; } .engageemail-legalinfo a { color: white; font-weight: bold; text-decoration: underline; border: none; } .engageemail-legalinfo p { margin: 0.3em 1em 0; } @media (prefers-color-scheme: dark) { body { background: darkslategray; } .engageemail-outer-wrapper { background-color: darkslategray; } .engageemail-container { background-color: #383636; color: lightgrey; } .engageemail-sitename { background-color: #1f2f2f; } .engageemail-sitename a { color: whitesmoke; } a.engageemail-button-danger:hover { color: orangered; } } </style><div class=\"engageemail-outer-wrapper\">\n<table>\n<tr>\n<td width=\"10%\"></td>\n<td>\n<div class=\"engageemail-wrapper\">\n<div class=\"engageemail-container\">\n<!-- Logo Header -->\n<div class=\"engageemail-sitename\">\n<a href=\"{SITEURL}\" title=\"Visitar {SITENAME}\">\n{SITENAME}\n</a>\n</div>\n<!-- Message -->\n<div class=\"engageemail-message\">\n<p>\nHola {RECIPIENT_NAME},\n</p>\n<p>\nSe ha enviado un nuevo comentario en “<a href=\"{CONTENT_LINK}\">{CONTENT_TITLE}</a>”. El comentario está actualmente sin publicar y espera su moderación.\n</p>\n<p>\nA continuación tiene los detalles del comentario.\n</p>\n<!-- Comment -->\n<div class=\"engageemail-comment-header\">\n<img src=\"{AVATAR_URL}\" class=\"engageemail-comment-header-avatar\">\n<span class=\"engageemail-comment-name\">\n{NAME}\n</span>\n<span class=\"engageemail-comment-email\">\n{EMAIL}\n</span>\n<span class=\"engageemail-comment-ip\">\nDesde {IP}\n</span>\n<span class=\"engageemail-comment-date\">\nel {DATE_LOCAL}\n</span>\n<span class=\"engageemail-comment-user-agent\">\nAgente de usuario: {USER_AGENT}\n</span>\n</div>\n<div class=\"engageemail-comment\">\n{COMMENT_SANITIZED}\n</div>\n<div>\n<a class=\"engageemail-button\" href=\"{COMMENT_LINK}\">\nVer comentario\n</a>\n<a class=\"engageemail-button engageemail-button-success\" href=\"{PUBLISH_URL}\">\nPublicar\n</a>\n<a class=\"engageemail-button engageemail-button-danger\" href=\"{DELETE_URL}\">\nEliminar\n</a>\n<a class=\"engageemail-button engageemail-button-warning\" href=\"{POSSIBLESPAM_URL}\">\nPosible SPAM\n</a>\n<a class=\"engageemail-button engageemail-button-danger\" href=\"{SPAM_URL}\">\nSPAM y eliminar\n</a>\n</div>\n</div>\n</div>\n\n<!-- Legal info -->\n<div class=\"engageemail-legalinfo\">\n<p>\nUsted recibe este email porque es administrador de comentarios del contenido que se ha comentado.\n</p>\n<p>\nNo <em>puede</em> darse de baja de estos emails porque es administrador de comentarios.\n</p>\n<p>\nPor favor, no responda a este email: se envía desde una dirección de email que no se supervisa.\n</p>\n</div>\n</div>\n</td>\n<td width=\"10%\"></td>\n</tr>\n</table>\n</div>"

