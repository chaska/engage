COM_ENGAGE_TITLE_EMAILTEMPLATES="Plantillas de email"

COM_ENGAGE_EMAILTEMPLATES_LBL_WHERE_HEAD="¿Dónde están las plantillas de email?"
COM_ENGAGE_EMAILTEMPLATES_LBL_WHERE_TEXT="Joomla gestiona de forma centralizada las plantillas de email del núcleo y de las extensiones de terceros, como Akeeba Engage, en la página Sistema, Plantillas de email. Sin embargo, las extensiones de terceros deben incluir su propio código para instalar y actualizar sus plantillas de email, y eso es lo que hace esta página. Si quiere personalizar las plantillas de email, pulse el botón de abajo para ir a la página de Plantillas de email de Joomla."
COM_ENGAGE_EMAILTEMPLATES_BTN_MAILTEMPLATES="Plantillas de email"

COM_ENGAGE_EMAILTEMPLATES_LBL_MANAGE_HEAD="Gestión de las plantillas de email"
COM_ENGAGE_EMAILTEMPLATES_BTN_UPDATE="Instalar o actualizar"
COM_ENGAGE_EMAILTEMPLATES_LBL_UPDATE="Instalar las plantillas de email nuevas de Akeeba Engage y actualizar las existentes si han cambiado. Las plantillas de email de Akeeba Engage modificadas por el usuario se dejan intactas."
COM_ENGAGE_EMAILTEMPLATES_BTN_RESET="Restablecer"
COM_ENGAGE_EMAILTEMPLATES_LBL_RESET="Restablecer las plantillas de email: se eliminan todas las plantillas de email de Akeeba Engage, <strong>incluidas las modificadas por el usuario</strong>, y después se vuelven a instalar desde cero. Use este botón solo si cree que ha dañado algo en su base de datos. En caso contrario, use el gestor de plantillas de email de Joomla para restablecer el asunto y el cuerpo de cada email a los valores por defecto con los botones de la interfaz de Joomla."

COM_ENGAGE_EMAILTEMPLATES_ERR_NOUPDATE="No se ha comprobado ninguna plantilla de email."
COM_ENGAGE_EMAILTEMPLATES_ERR_RESET="No se ha restablecido ninguna plantilla de email."

