COM_ENGAGE="Akeeba Engage"
COM_ENGAGE_XML_DESCRIPTION="Comentarios para los artículos Joomla!™ fácilmente"

COM_ENGAGE_CONFIGURATION="Akeeba Engage <small>Configuración del sitio</small>"

; Permissions
COM_ENGAGE_CONFIG_ACL_CREATE="Comentario"
COM_ENGAGE_CONFIG_ACL_CREATE_DESC="Permite a los usuarios del grupo enviar comentarios"
COM_ENGAGE_CONFIG_ACL_DELETE_DESC="Permite a los usuarios del grupo eliminar comentarios de forma permanente"
COM_ENGAGE_CONFIG_ACL_EDIT_DESC="Permite a los usuarios del grupo editar cualquier comentario, aunque no sea suyo"
COM_ENGAGE_CONFIG_ACL_EDIT_OWN_DESC="Permite a los usuarios del grupo editar sus propios comentarios"
COM_ENGAGE_CONFIG_ACL_EDIT_STATE_DESC="Permite a los usuarios del grupo publicar y despublicar comentarios"

; Configuration -- Basic
COM_ENGAGE_CONFIG_BASIC_FIELDSET_LABEL="Básica"
COM_ENGAGE_CONFIG_BASIC_FIELDSET_DESC="Configuración básica sobre cómo funcionan los comentarios"

COM_ENGAGE_CONFIG_MAX_LEVEL_LABEL="Nivel máximo de anidación de comentarios"
COM_ENGAGE_CONFIG_MAX_LEVEL_DESC="<p>Los comentarios pueden anidarse hasta este número de niveles. Por ejemplo, 3 niveles significa que hay comentarios de primer nivel (1<sup>er</sup> nivel), respuestas a esos comentarios (2<sup>º</sup> nivel) y respuestas a las respuestas (3<sup>er</sup> nivel). Mantenga un valor relativamente bajo para conseguir una conversación más coherente y una presentación más razonable de los comentarios.</p><p>El valor por defecto es 3, similar al que usan otros sistemas de comentarios que sus visitantes ya conocen, como Disqus. Use 2 para imitar lo que hacen redes sociales como Facebook o YouTube. Use 1 para no permitir la anidación (solo comentarios de primer nivel).</p><p><strong>ESTE AJUSTE NO SE APLICA RETROACTIVAMENTE.</strong> Solo afecta a las respuestas nuevas. Poner un valor menor no “aplanará” los hilos de comentarios que ya existen.</p><p>Este ajuste NO SE PUEDE sobrescribir para categorías o artículos concretos.</p>"
COM_ENGAGE_CONFIG_REPLIES_FIELDSET_LABEL="Respuestas"
COM_ENGAGE_CONFIG_REPLIES_FIELDSET_DESC="Cómo se ven las respuestas en la lista de comentarios. Las respuestas se muestran siempre anidadas bajo el comentario al que contestan (hasta el nivel máximo de anidación). Estas opciones solo cambian su aspecto y no necesitan CSS adicional."
COM_ENGAGE_CONFIG_REPLY_SHOW_QUOTE_LABEL="Mostrar a quién contesta una respuesta"
COM_ENGAGE_CONFIG_REPLY_SHOW_QUOTE_DESC="Muestra una línea pequeña «En respuesta a &lt;nombre&gt;» en cada respuesta, con un enlace al comentario al que contesta. El valor por defecto es Sí."
COM_ENGAGE_CONFIG_REPLY_INDENT_LABEL="Sangría de las respuestas"
COM_ENGAGE_CONFIG_REPLY_INDENT_DESC="Cuánto se desplaza a la derecha cada nivel de anidación. El valor por defecto es Media. Para usar un tamaño exacto, defina la variable CSS --akengage-reply-indent en el CSS personalizado de su plantilla (por ejemplo: :root { --akengage-reply-indent: 3rem; }); tiene prioridad sobre esta opción."
COM_ENGAGE_CONFIG_REPLY_INDENT_NONE="Ninguna"
COM_ENGAGE_CONFIG_REPLY_INDENT_SMALL="Pequeña"
COM_ENGAGE_CONFIG_REPLY_INDENT_MEDIUM="Media"
COM_ENGAGE_CONFIG_REPLY_INDENT_LARGE="Grande"
COM_ENGAGE_CONFIG_REPLY_STYLE_LABEL="Marca visual de las respuestas"
COM_ENGAGE_CONFIG_REPLY_STYLE_DESC="Cómo se destacan las respuestas. Línea lateral conserva la línea de color junto a cada comentario (el aspecto original). Fondo suave da a las respuestas un fondo claro en lugar de la línea. Los comentarios sin publicar y el SPAM conservan siempre su línea de color."
COM_ENGAGE_CONFIG_REPLY_STYLE_LINE="Línea lateral"
COM_ENGAGE_CONFIG_REPLY_STYLE_SOFT="Fondo suave"
COM_ENGAGE_CONFIG_REPLY_STYLE_NONE="Ninguna"

COM_ENGAGE_DEFAULT_PUBLISH_LABEL="Nuevos comentarios"
COM_ENGAGE_DEFAULT_PUBLISH_DESC="<p>¿Deben publicarse o quedar sin publicar por defecto los comentarios nuevos? En el segundo caso, un administrador de comentarios tiene que publicarlos manualmente.</p><p><strong>¡IMPORTANTE!</strong> Esta opción NO se aplica a los comentarios publicados por administradores de comentarios. Esos comentarios se publican siempre de inmediato. No tendría sentido pedir a quien publica un comentario que lo modere él mismo.</p>"

COM_ENGAGE_DEFAULT_LIMIT_LABEL="Número de comentarios por página"
COM_ENGAGE_DEFAULT_LIMIT_DESC="<p>Elija cuántos comentarios se muestran a la vez. Usar global aplica el límite de listados por defecto de la Configuración global del sitio.</p><p><strong>¡Atención!</strong> Usar las opciones más altas (sobre todo 500 o Todos) puede producir una página en blanco, un error HTTP 504 (Gateway Timeout) o una respuesta muy lenta del servidor en contenidos con muchísimos comentarios. Recomendamos un valor más prudente, como 50 o incluso 20.</p>"

COM_ENGAGE_CONFIG_CAPTCHA_LABEL="CAPTCHA para los comentarios"
COM_ENGAGE_CONFIG_CAPTCHA_DESC="<p>Seleccione el plugin CAPTCHA que se usará en el formulario de comentarios. Puede que tenga que introducir la información que necesite su plugin CAPTCHA en el Gestor de plugins.</p><p>Si se selecciona “Usar global”, asegúrese de que haya un plugin CAPTCHA seleccionado en la Configuración global de Joomla.</p><p>Este ajuste NO SE PUEDE sobrescribir para categorías o artículos concretos.</p>"

COM_ENGAGE_CONFIG_CAPTCHA_FOR_LABEL="Usar CAPTCHA con estos usuarios"
COM_ENGAGE_CONFIG_CAPTCHA_FOR_DESC="<p>¿A qué usuarios que envían un comentario se les debe mostrar el CAPTCHA definido arriba? Recomendamos usar Invitados.</p><p>“<strong>Invitados</strong>” solo mostrará el CAPTCHA a los usuarios invitados (que no han iniciado sesión).</p><p>“<strong>Cualquiera salvo los administradores de comentarios</strong>” lo mostrará a los invitados y también a los usuarios con sesión iniciada que no tengan activado el privilegio “Configurar”.</p><p>“<strong>Todos</strong>” lo mostrará a todo el que envíe un comentario.</p>"
COM_ENGAGE_CONFIG_CAPTCHA_FOR_GUESTS="Invitados"
COM_ENGAGE_CONFIG_CAPTCHA_FOR_NONMANAGER="Cualquiera salvo los administradores de comentarios"
COM_ENGAGE_CONFIG_CAPTCHA_FOR_ALL="Todos"

COM_ENGAGE_CONFIG_TOS_ACCEPT_LABEL="Los invitados deben aceptar las condiciones"
COM_ENGAGE_CONFIG_TOS_ACCEPT_DESC="<p>Si se activa, se pedirá a los usuarios invitados que marquen una casilla para aceptar las condiciones de uso y / o la política de privacidad de su sitio. Si no la marcan, no podrán enviar un comentario.</p><p>Esto puede ser necesario para cumplir el RGPD de la UE u otra legislación similar.</p><p>Puede personalizar el texto de la casilla en la opción Texto de la casilla de condiciones, más abajo.</p><p>Puede personalizar el mensaje de error que ven los usuarios invitados cuando no marcan la casilla creando una sustitución de idioma del frontend para la cadena de idioma <code>COM_ENGAGE_COMMENTS_ERR_TOSACCEPT</code>.</p>"

COM_ENGAGE_CONFIG_TOS_PROMPT_LABEL="Texto de la casilla de condiciones"
COM_ENGAGE_CONFIG_TOS_PROMPT_DESC="<p>Introduzca el texto que se mostrará junto a la casilla que los usuarios deberán marcar para enviar un comentario. Puede usar HTML completo y códigos de plugin.</p><p>Si lo deja en blanco se usará un texto genérico por defecto (vea la clave de idioma <code>COM_ENGAGE_COMMENTS_FORM_LBL_ACCEPT</code>).</p>"

COM_ENGAGE_CONFIG_HEADER_OVERRIDABLE_HEADER="Parámetros de comentarios por defecto"
COM_ENGAGE_CONFIG_HEADER_OVERRIDABLE_DESC="Los siguientes parámetros pueden sobrescribirse en cada artículo o categoría de artículos."

COM_ENGAGE_COMMENTS_SHOW_LABEL="Interfaz de comentarios"
COM_ENGAGE_COMMENTS_SHOW_DESC="¿Mostrar la interfaz de comentarios? Si elige Ocultar, se ocultarán todos los comentarios existentes y se deshabilitarán los nuevos. Este ajuste puede sobrescribirse en categorías y / o artículos concretos."

COM_ENGAGE_COMMENTS_SHOW_FEATURE_LABEL="Resumen en la vista de destacados"
COM_ENGAGE_COMMENTS_SHOW_FEATURE_DESC="¿Mostrar el número de comentarios enviados a cada artículo en la vista de Artículos destacados de Joomla?"

COM_ENGAGE_COMMENTS_SHOW_CATEGORY_LABEL="Resumen en la vista de blog"
COM_ENGAGE_COMMENTS_SHOW_CATEGORY_DESC="¿Mostrar el número de comentarios enviados a cada artículo en la vista de blog de Joomla?"

COM_ENGAGE_COMMENTS_SHOW_ARTICLE_LABEL="Resumen en el módulo Newsflash"
COM_ENGAGE_COMMENTS_SHOW_ARTICLE_DESC="¿Mostrar el número de comentarios enviados a cada artículo mostrado en el módulo Newsflash de Joomla?"

COM_ENGAGE_OPT_COMMENTS_SHOW_BEFORE="Antes del contenido"
COM_ENGAGE_OPT_COMMENTS_SHOW_AFTER="Después del contenido"

COM_ENGAGE_COMMENTS_ENABLED_LABEL="Permitir nuevos comentarios"
COM_ENGAGE_COMMENTS_ENABLED_DESC="¿Permitir comentarios nuevos? Si elige No, se bloquean los comentarios (se podrán ver los existentes pero no añadir uno nuevo). Este ajuste puede sobrescribirse en categorías y / o artículos concretos."

COM_ENGAGE_COMMENTS_REPLY_BAD_UX_LABEL="Área de comentarios oculta por defecto"
COM_ENGAGE_COMMENTS_REPLY_BAD_UX_DESC="¿Debe ocultarse por defecto el área de comentarios / respuestas? Si es así, en su lugar aparecerá un botón Deje su comentario. Cuando el usuario pulse ese botón (o el botón Responder de cualquier comentario), el botón desaparece y se muestra el área de comentarios. <strong>Esto es una mala experiencia de usuario y confundirá a la mayoría de quienes intenten dejar un comentario.</strong> No recomendamos usar esta opción."

COM_ENGAGE_COMMENTS_PLEASEWAIT_LABEL="Mostrar ‘Espere un momento’ en el botón mientras se envía el comentario"
COM_ENGAGE_COMMENTS_PLEASEWAIT_DESC="Si se activa, al pulsarlo el botón de enviar el comentario quedará deshabilitado y mostrará el mensaje ‘Espere un momento’. Es útil si su sitio es muy lento y los usuarios intentan pulsar el botón varias veces al enviar comentarios. Tenga en cuenta que esta función depende de JavaScript. Si el navegador del usuario tiene JavaScript desactivado, el formulario seguirá funcionando como si la función estuviera desactivada."

COM_ENGAGE_COMMENTS_MIN_LENGTH_LABEL="Longitud mínima del comentario"
COM_ENGAGE_COMMENTS_MIN_LENGTH_DESC="La longitud mínima permitida (en bytes) del HTML de un comentario. Use 0 para no aplicar ningún límite."

COM_ENGAGE_COMMENTS_MAX_LENGTH_LABEL="Longitud máxima del comentario"
COM_ENGAGE_COMMENTS_MAX_LENGTH_DESC="La longitud máxima permitida (en bytes) del HTML de un comentario. Use 0 para no aplicar ningún límite. Si no es 0, debe ser mayor que la “Longitud mínima del comentario”; de lo contrario este ajuste se <em>ignora</em>."

COM_ENGAGE_COMMENTS_ORDERING_LABEL="Orden de los comentarios"
COM_ENGAGE_COMMENTS_ORDERING_DESC="Orden de los comentarios, por fecha. Ascendente muestra primero los comentarios más antiguos. Descendente muestra primero los más recientes."

COM_ENGAGE_COMMENTS_CLOSE_AFTER_LABEL="Cerrar comentarios cuando pasen estos días"
COM_ENGAGE_COMMENTS_CLOSE_AFTER_DESC="Los comentarios se cerrarán automáticamente cuando pasen estos días desde la publicación del artículo. 0 es un valor especial: significa que los comentarios no se cerrarán nunca de forma automática. Este ajuste puede sobrescribirse en categorías y / o artículos concretos."

COM_ENGAGE_COMMENTS_NOTIFY_AUTHOR_LABEL="Notificar al autor"
COM_ENGAGE_COMMENTS_NOTIFY_AUTHOR_DESC="¿Notificar (enviar emails) al autor del contenido de todos los comentarios nuevos publicados en su contenido?"

COM_ENGAGE_COMMENTS_NOTIFY_USERS_LABEL="Notificar a los usuarios"
COM_ENGAGE_COMMENTS_NOTIFY_USERS_DESC="¿Notificar (enviar emails) a los usuarios cuando se envía una respuesta a un comentario que publicaron en el contenido?"

; Configuration -- Text Filtering
COM_ENGAGE_CONFIG_FILTERING_FIELDSET_LABEL="Filtrado de texto"
COM_ENGAGE_CONFIG_FILTERING_FIELDSET_DESC="Configura el filtrado del HTML de los comentarios. <strong>¡ADVERTENCIA!</strong> Modificar estas opciones afecta a la seguridad de su sitio. Se recomienda encarecidamente usar las opciones por defecto, salvo que tenga claras las consecuencias para la seguridad."

COM_ENGAGE_CONFIG_FILTER_MODE_LABEL="Modo de filtrado"
COM_ENGAGE_CONFIG_FILTER_MODE_DESC="<p>Akeeba Engage ofrece tres modos de filtrar el contenido HTML de los comentarios para hacerlos seguros:</p><ul><li><strong>Filtros de texto de Joomla</strong>. Usa las opciones de Filtros de texto definidas en la Configuración global, con el propio código de filtrado HTML de Joomla.</li><li><strong>HTML Purifier</strong>. Usa la biblioteca HTML Purifier, más robusta. Cuando un grupo de usuarios está configurado sin filtrado HTML, recurre al código de Joomla que elimina todas las etiquetas HTML.</li><li><strong>HTML Purifier (permitir HTML mínimo)</strong>. Como la opción anterior, pero cuando un grupo de usuarios está configurado sin filtrado HTML se permite un subconjunto <em>muy</em> pequeño de etiquetas HTML seguras. Recomendado para que los usuarios invitados puedan enviar comentarios con formato sin poner en riesgo la seguridad de su sitio.</li></ul>"
COM_ENGAGE_CONFIG_FILTER_MODE_JOOMLA="Filtros de texto de Joomla"
COM_ENGAGE_CONFIG_FILTER_MODE_HTMLPURIFIER="HTML Purifier"
COM_ENGAGE_CONFIG_FILTER_MODE_STRICT="HTML Purifier (permitir HTML mínimo)"

COM_ENGAGE_CONFIG_HTMLPURIFIER_CONFIG_JOOMLA_LABEL="HTML Purifier usa la configuración de los filtros de texto de Joomla"
COM_ENGAGE_CONFIG_HTMLPURIFIER_CONFIG_JOOMLA_DESC="<p>Solo se aplica si el Modo de filtrado es “HTML Purifier (con alternativa de Joomla)” o “Solo HTML Purifier”.</p><p>Si se activa, HTML Purifier usará la lista negra y la lista blanca de etiquetas y atributos definidas en la pestaña Filtros de texto de la Configuración global de Joomla. Así puede tener un nivel de filtrado HTML distinto por grupo de usuarios, pero en algunas circunstancias puede no ser seguro.</p><p>Si se desactiva, HTML Purifier usará la opción “Lista blanca de HTML Purifier” de más abajo para <strong>todos los usuarios</strong>. Es lo más seguro, pero le impide usar etiquetas avanzadas, incrustar vídeos, etc., ¡incluso siendo Super usuario!</p>"

COM_ENGAGE_CONFIG_HTMLPURIFIER_CONFIGSTRING_LABEL="Lista blanca de HTML Purifier"
COM_ENGAGE_CONFIG_HTMLPURIFIER_CONFIGSTRING_DESC="<p>Solo se aplica cuando se cumplen a la vez a. el Modo de filtrado es “HTML Purifier (con alternativa de Joomla)” o “Solo HTML Purifier” y b. “HTML Purifier usa la configuración de los filtros de texto de Joomla” está en No.</p><p>Esta opción indica a HTML Purifier qué etiquetas y qué atributos se permiten. Todo lo que no se defina aquí de forma explícita se rechazará.</p><p>Es una cadena de elementos separados por comas, definidos como <code>etiqueta</code> (etiqueta permitida sin atributos) o <code>etiqueta[atributo]</code> (atributo permitido para la etiqueta). Los ajustes son acumulativos.</p>"

; Configuration -- Advanced
COM_ENGAGE_CONFIG_ADVANCED_FIELDSET_LABEL="Avanzado"
COM_ENGAGE_CONFIG_ADVANCED_FIELDSET_DESC="Opciones de configuración para usuarios expertos"

COM_ENGAGE_CONFIG_WORKAROUND_MAILTEMPLATE_LABEL="Solución alternativa para las plantillas de email defectuosas de Joomla! 5.2 y posteriores."
COM_ENGAGE_CONFIG_WORKAROUND_MAILTEMPLATE_DESC="Joomla! 5.2 introdujo la función de diseño de plantillas de email (Mail Template Layout) y la activa por defecto. Sin embargo, esa función <em>rompe</em> los enlaces de los emails cuando su URL procede de una variable, como <code>{URL}</code>, porque añade la URL del sitio delante y la convierte en una URL no válida. Esto afecta incluso a los componentes del propio Joomla. Aunque no podemos arreglar Joomla, sí podemos ofrecer una solución alternativa para los emails que envía nuestro software. Si por cualquier motivo no quiere esa solución alternativa, puede desactivarla poniendo esta opción en No."

COM_ENGAGE_CONFIG_LOGIN_LABEL="Módulo de inicio de sesión"
COM_ENGAGE_CONFIG_LOGIN_DESC="<p>Akeeba Engage mostrará una zona de inicio de sesión si el usuario actual es un invitado (no ha iniciado sesión). Esta opción determina qué módulo se usará en esa zona.</p><p>Tenga en cuenta que Akeeba Engage mostrará <strong>siempre</strong> todos los módulos publicados en la posición de módulo <code>engage-login</code>, sea cual sea este ajuste.</p><p>Por limitaciones del funcionamiento de Joomla, cualquier módulo seleccionado aquí se cargará con <em>su configuración por defecto</em>, lo que puede no ser útil en la mayoría de sitios. Recomendamos seleccionar aquí la opción “( No mostrar )” y publicar en la posición de módulo <code>engage-login</code> cualquier HTML personalizado y módulo de inicio de sesión.</p><p>Naturalmente, si pone esta opción en “( No mostrar )” y no publica ningún módulo en la posición <code>engage-login</code>, la zona de inicio de sesión queda totalmente desactivada.</p>"
COM_ENGAGE_CONFIG_LOGIN_NONE="( No mostrar )"

COM_ENGAGE_CONFIG_IPLOOKUP_LABEL="Servicio de información de IP"
COM_ENGAGE_CONFIG_IPLOOKUP_DESC="<p>Introduzca una URL para un servicio de información de IP. Esto se usa siempre que Akeeba Engage muestra direcciones IP a los administradores de comentarios y editores de contenido.</p><p>Utilice el formato <code>https://www.example.com/something/%s</code>, es decir, sustituya la IP mostrada en la URL del servicio de información de IP con <code>%s</code>.</p><p>Para su conveniencia se incluye un servicio por defecto. Este servicio NO está relacionado ni afiliado con Akeeba Ltd en ninguna manera.</p>"

COM_ENGAGE_CONFIG_MAX_SPAM_AGE_LABEL="Antigüedad máxima del SPAM"
COM_ENGAGE_CONFIG_MAX_SPAM_AGE_DESC="<p>El SPAM con más de este número de días de antigüedad se elimina automáticamente cuando visita la administración del sitio, cuando ejecuta el script CLI <code>engage-clean-spam.php</code> o cada 8 horas de forma automática (siempre que el plugin de contenido esté cargado y haya tráfico en su sitio).</p><p>Use el valor especial 0 para desactivar esta función. Con 0, Akeeba Engage no elimina nunca el SPAM de forma automática. Tendrá que eliminarlo usted mismo o ejecutar el script CLI <code>engage-clean-spam.php</code> con un parámetro --max-days personalizado.</p>"

COM_ENGAGE_CONFIG_AMP_CSS_LABEL="Inyectar CSS en las páginas AMP"
COM_ENGAGE_CONFIG_AMP_CSS_DESC="<p>Solo se aplica si usa wbAMP.</p><p>¿Debe Akeeba Engage inyectar el contenido de su archivo CSS preparado para AMP (por defecto: <code>media/com_engage/css/amp.css</code>) en la página AMP generada? Si piensa crear su propia plantilla AMP y / o personalizar usted mismo el CSS de AMP, debe poner esto en No.</p>"

COM_ENGAGE_CONFIG_HTMLPURIFIER_INCLUDE_LABEL="Inclusión de HTML Purifier"
COM_ENGAGE_CONFIG_HTMLPURIFIER_INCLUDE_DESC="<p>Elija cómo incluirá Akeeba Engage la biblioteca HTML Purifier. Si no está seguro, elija “Composer”.</p><ul><li><strong>Composer</strong> Usa el autocargador de Composer. Es la opción por defecto y la recomendada.</li><li><strong>Autocargador</strong> Usa el autocargador de HTML Purifier. Funcionalmente equivale a “Composer”, pero no carga Composer, ya que HTML Purifier no lo usa.</li><li><strong>Todo a la vez</strong> Carga en memoria todas las clases de HTML Purifier de una vez. Ofrece mejor rendimiento si su sitio usa la caché de opcode de PHP.</li></ul>"
COM_ENGAGE_CONFIG_HTMLPURIFIER_INCLUDE_COMPOSER="Composer"
COM_ENGAGE_CONFIG_HTMLPURIFIER_INCLUDE_AUTO="Autocargador"
COM_ENGAGE_CONFIG_HTMLPURIFIER_INCLUDE_ALL="Todo a la vez"

COM_ENGAGE_CONFIG_LOADCUSTOMCSS_LABEL="Cargar CSS personalizado"
COM_ENGAGE_CONFIG_LOADCUSTOMCSS_DESC="Úselo solo en sitios que NO usen Bootstrap 5 en la plantilla de la parte pública. Carga un archivo CSS personalizado (media/com_engage/css/comments.css o su sustitución en media) en las páginas de la parte pública."
