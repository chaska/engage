COM_ENGAGE_MAIL_MANAGE_TITLE="Moderate: Ask comment managers to moderate a new, unpublished comment"
COM_ENGAGE_MAIL_MANAGE_SHORT="Moderate"
COM_ENGAGE_MAIL_MANAGE_DESC="Sent to comment managers when an unpublished comment awaits moderation."
COM_ENGAGE_MAIL_MANAGE_SUBJECT="A new comment on “{CONTENT_TITLE}” awaits your moderation"
COM_ENGAGE_MAIL_MANAGE_BODY="Hello {RECIPIENT_NAME},\n\nA new comment was filed on “{CONTENT_TITLE}”. The comment is currently unpublished and awaits your moderation.\n\nPlease find the comment details below.\n\n{NAME} <{EMAIL}>\nFrom {IP}, on {DATE_LOCAL}\nUser Agent: {USER_AGENT}\n\n{COMMENT_SANITIZED}\n\nComment URL: {COMMENT_LINK}\n\nYou are receiving this email because you are a comments manager for the content that was commented on.\nYou cannot unsubscribe from these emails because you are a comments manager.\nPlease do not reply to this email, it's sent from an unmonitored email address."
COM_ENGAGE_MAIL_MANAGE_BODY_HTML="<style type=\"text/css\"> :root { color-scheme: light dark; } /*Reset styles*/ body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 12pt; margin: 0; padding: 0; color: black; background: slategrey; } .engageemail-outer-wrapper { background: slategrey; } .engageemail-outer-wrapper table { width: 100%; max-width: 960px; margin: 0 auto; } .engageemail-wrapper { width: 100%; height: 100%; padding: 1em; } .engageemail-container { background-color: white; color: black; text-align: left; box-shadow: black 0 0 8px; } .engageemail-sitename { background-color: #efefef; text-align: right; padding: 1em 1em; min-height: 40px; } .engageemail-sitename a { color: black; font-size: 16pt; border: none; text-decoration: none; } .engageemail-message { padding: 0.5em 1em; } .engageemail-message a { color: #38b5b8; text-decoration: underline; } .engageemail-comment-header { padding: 0.25em; background-color: darkslategray; color: white; } img.engageemail-comment-header-avatar { float: left; margin: 0 0.5em 0.5em 0; } span.engageemail-comment-name { display: block; font-weight: bold; } span.engageemail-comment-email { display: block; font-size: 90%; } span.engageemail-comment-ip, span.engageemail-comment-date, span.engageemail-comment-user-agent { font-size: 90%; color: lightgrey; } span.engageemail-comment-user-agent:before { content: \" • \"; } .engageemail-comment { margin: 0.5em 0; border-left: 3px solid grey; padding: 0 .5em; overflow: scroll; } a.engageemail-button { display: inline-block; text-align: center; padding: 0.25em 0.5em; color: cornflowerblue; box-sizing: border-box; text-decoration: none; font-size: 10pt; } a.engageemail-button:hover { color: dodgerblue; } a.engageemail-button-success { color: seagreen; } a.engageemail-button-success:hover { color: darkseagreen; } a.engageemail-button-warning { color: darkorange; } a.engageemail-button-warning:hover { color: orange; } a.engageemail-button-danger { color: red; } a.engageemail-button-danger:hover { color: darkred; } .engageemail-legalinfo { text-align: center; width: 100%; max-width: 960px; color: lightgrey; font-size: 9pt; font-weight: normal; background-color: rgba(0, 0, 0, 0.2); margin: 2em auto; padding: 0.5em 0; } .engageemail-legalinfo a { color: white; font-weight: bold; text-decoration: underline; border: none; } .engageemail-legalinfo p { margin: 0.3em 1em 0; } @media (prefers-color-scheme: dark) { body { background: darkslategray; } .engageemail-outer-wrapper { background-color: darkslategray; } .engageemail-container { background-color: #383636; color: lightgrey; } .engageemail-sitename { background-color: #1f2f2f; } .engageemail-sitename a { color: whitesmoke; } a.engageemail-button-danger:hover { color: orangered; } } </style><div class=\"engageemail-outer-wrapper\">\n<table>\n<tr>\n<td width=\"10%\"></td>\n<td>\n<div class=\"engageemail-wrapper\">\n<div class=\"engageemail-container\">\n<!-- Logo Header -->\n<div class=\"engageemail-sitename\">\n<a href=\"{SITEURL}\" title=\"Visit {SITENAME}\">\n{SITENAME}\n</a>\n</div>\n<!-- Message -->\n<div class=\"engageemail-message\">\n<p>\nHello {RECIPIENT_NAME},\n</p>\n<p>\nA new comment was filed on “<a href=\"{CONTENT_LINK}\">{CONTENT_TITLE}</a>”. The comment is currently unpublished and awaits your moderation.\n</p>\n<p>\nPlease find the comment details below.\n</p>\n<!-- Comment -->\n<div class=\"engageemail-comment-header\">\n<img src=\"{AVATAR_URL}\" class=\"engageemail-comment-header-avatar\">\n<span class=\"engageemail-comment-name\">\n{NAME}\n</span>\n<span class=\"engageemail-comment-email\">\n{EMAIL}\n</span>\n<span class=\"engageemail-comment-ip\">\nFrom {IP}\n</span>\n<span class=\"engageemail-comment-date\">\non {DATE_LOCAL}\n</span>\n<span class=\"engageemail-comment-user-agent\">\nUser Agent: {USER_AGENT}\n</span>\n</div>\n<div class=\"engageemail-comment\">\n{COMMENT_SANITIZED}\n</div>\n<div>\n<a class=\"engageemail-button\" href=\"{COMMENT_LINK}\">\nView Comment\n</a>\n<a class=\"engageemail-button engageemail-button-success\" href=\"{PUBLISH_URL}\">\nPublish\n</a>\n<a class=\"engageemail-button engageemail-button-danger\" href=\"{DELETE_URL}\">\nDelete\n</a>\n<a class=\"engageemail-button engageemail-button-warning\" href=\"{POSSIBLESPAM_URL}\">\nPossible Spam\n</a>\n<a class=\"engageemail-button engageemail-button-danger\" href=\"{SPAM_URL}\">\nSpam and Delete\n</a>\n</div>\n</div>\n</div>\n\n<!-- Legal info -->\n<div class=\"engageemail-legalinfo\">\n<p>\nYou are receiving this email because you are a comments manager for the content that was commented on.\n</p>\n<p>\nYou <em>cannot</em> unsubscribe from these emails because you are a comments manager.\n</p>\n<p>\nPlease do not reply to this email, it's sent from an unmonitored email address.\n</p>\n</div>\n</div>\n</td>\n<td width=\"10%\"></td>\n</tr>\n</table>\n</div>"

