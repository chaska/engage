COM_ENGAGE_EMAILTEMPLATES_LBL_WHERE_HEAD="Where are the Email Templates?"
COM_ENGAGE_EMAILTEMPLATES_LBL_WHERE_TEXT="Email templates for core and third party extensions, like Akeeba Engage, are centrally managed by Joomla itself in the System, Mail Templates page. Third party extensions, however, need to implement their own code to install and update the email templates. This is what this page does. If you want to customise the email templates please click the button below to go to Joomla's Mail Templates page."
COM_ENGAGE_EMAILTEMPLATES_BTN_MAILTEMPLATES="Mail Templates"

COM_ENGAGE_EMAILTEMPLATES_LBL_MANAGE_HEAD="Email Template management"
COM_ENGAGE_EMAILTEMPLATES_BTN_UPDATE="Install or Update"
COM_ENGAGE_EMAILTEMPLATES_LBL_UPDATE="Installs new email templates for Akeeba Engage and updates existing ones if they've changed. The user-modified email templates for Akeeba Engage are left intact."
COM_ENGAGE_EMAILTEMPLATES_BTN_RESET="Reset"
COM_ENGAGE_EMAILTEMPLATES_LBL_RESET="Resets the email templates. This removes all of the email templates for Akeeba Engage, <strong>including any user-modified email templates</strong>. Then it installs all of the Akeeba Engage email templates afresh. Only use this button if you think you've damaged something in your database. Otherwise use the Joomla Email Templates manager to reset each email's subject and body to the default using the buttons provided in Joomla's interface."

